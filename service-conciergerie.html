<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conciergerie – L’Adresse SARL</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><header class="top-header"><div class="brand"><div class="brand-icon">L</div><div class="brand-name">L’ADRESSE SARL</div></div><a class="btn-contact" href="index.html">← Retour Accueil</a></header>
<section class="hero" style="min-height:45vh"><div class="hero-left"><h1>Conciergerie personnalisée</h1><div class="hero-sub">Un seul interlocuteur à Glass, Libreville. Assistance 24/7</div></div><div class="hero-right"><img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=800"></div></section>
<section style="padding:80px 0;background:var(--cream)"><div class="container"><div class="config-wrap"><div class="config-tabs"><button class="active" data-s="1">1. Besoin</button><button data-s="2">2. Formule</button><button data-s="3">3. Personnaliser</button><button data-s="4">4. Demande</button></div><div class="config-body" id="cfgBody"></div></div></div></section>
<script>
const SHEET_URL="https://script.google.com/macros/s/AKfycbww-7Nn7ro4OZ-R1oVuoLSdY6P7OWOHJzLl0I4KNazjOXjGYWlmxFzpq-ti7sHGA2zP/exec";
const state={type:null,heberg:null,services:[],conf:'standard',budget:'proposition',budgetVal:'',nom:'',tel:'',membres:'',securite:'',cuisine:'',prefCul:'non',voiture:'',desc:''};
const hebs=[{id:'c1',name:'Assistance Ponctuelle',cap:'À la demande – mission unique',img:'https://images.unsplash.com/photo-1566073771259-6a8506099945?w=400'},{id:'c2',name:'Formule Abonnement',cap:'Premium / Luxe / Prestige',img:'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=400'}];
const servsPonctuel=["Fête & Surprise (anniversaire, demande en mariage, baby shower...)","Courses & Cadeaux (ex: entrepreneuse occupée)","Voiture & Chauffeur","Chef privé","Autre besoin – Expliquez-nous"];
const servsAbo=["Chauffeur privé","Location voiture","Chef privé","Guide touristique","Activités","Sécurité privée","Autre besoin – Expliquez-nous"];
let prixVoitures=[];
function getServs(){return state.heberg==='c1'?servsPonctuel:servsAbo;}
async function loadPrix(){try{const r=await fetch(SHEET_URL+"?type=prix");const d=await r.json(); prixVoitures=d.filter(p=>String(p.actif).toLowerCase()==='oui');}catch(e){prixVoitures=[{nom:'Berline',prix:'20000',unite:'FCFA/J'},{nom:'SUV Premium',prix:'35000',unite:'FCFA/J'}];}}
function hasVoiture(){return state.services.some(s=>s.toLowerCase().includes('voiture')||s.toLowerCase().includes('chauffeur'));}
function render(n){
document.querySelectorAll('.config-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.s==n));
const body=document.getElementById('cfgBody');
if(n==1){body.innerHTML=`<div class="config-grid">${['Quotidien','Business','Événement','Personnalisée'].map(t=>`<div class="opt ${state.type===t?'selected':''}" onclick="state.type='${t}';render(1)"><b>${t}</b></div>`).join('')}</div><div style="text-align:right;margin-top:20px"><button class="btn-gold" onclick="render(2)">Continuer →</button></div>`;}
if(n==2){body.innerHTML=`<div class="config-grid">${hebs.map(h=>`<div class="opt ${state.heberg===h.id?'selected':''}" onclick="state.heberg='${h.id}';render(2)"><img src="${h.img}"><div><b>${h.name}</b><br><small>${h.cap}</small></div></div>`).join('')}</div><div style="display:flex;justify-content:space-between;margin-top:20px"><button class="btn-gold" onclick="render(1)">← Retour</button><button class="btn-gold" onclick="render(3)">Personnaliser →</button></div>`;}
if(n==3){
body.innerHTML=`<div style="background:var(--navy);color:white;padding:16px;border-radius:12px;margin-bottom:20px;font-size:13px">${state.heberg==='c1'?'Besoin du quotidien – ex: fête surprise, cadeau enfant, course urgente.<br><b style="color:var(--gold-light)">✓ Assistance médicale incluse</b>':'Enrichissez votre formule abonnement.<br><b style="color:var(--gold-light)">✓ Assistance médicale incluse</b>'}</div>
<div class="config-grid">${getServs().map(s=>`<label class="opt ${state.services.includes(s)?'selected':''}"><input type="checkbox" ${state.services.includes(s)?'checked':''} onchange="toggleS('${s.replace(/'/g,"\\'")}')">${s}</label>`).join('')}</div>
<div style="text-align:right;margin-top:20px"><button class="btn-gold" onclick="render(4)">Aller au formulaire →</button></div>`;}
if(n==4){
const heb=hebs.find(h=>h.id===state.heberg);
let html=`<div style="margin-bottom:16px;background:#f7f3ef;padding:12px;border-radius:10px"><small>Sélection:</small><br><b>${state.type||'—'} • ${heb?heb.name:'—'} • ${state.services.join(', ')||'—'}</b></div>
<p style="font-weight:600;font-size:13px">Modalité</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0"><label class="opt ${state.conf==='standard'?'selected':''}" onclick="state.conf='standard';render(4)"><input type="radio" ${state.conf==='standard'?'checked':''}> Standard</label><label class="opt ${state.conf==='confidentielle'?'selected':''}" onclick="state.conf='confidentielle';render(4)"><input type="radio" ${state.conf==='confidentielle'?'checked':''}> Confidentielle</label></div>`;
html+= state.conf==='standard'?`<input id="nom" placeholder="Nom complet" value="${state.nom}" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:10px"><input id="tel" placeholder="Téléphone" value="${state.tel}" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:10px"><input id="membres" placeholder="Nombre de personnes" value="${state.membres}" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:10px">`:`<input id="tel" placeholder="Téléphone uniquement" value="${state.tel}" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:10px">`;
if(hasVoiture()){
html+=`<div style="margin:12px 0"><label style="font-weight:600;font-size:13px">Choisissez votre véhicule (depuis Prix_Services)</label><select id="voiture" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-top:6px"><option value="">Sélectionnez</option>${prixVoitures.map(v=>`<option value="${v.nom} – ${v.prix} ${v.unite}" ${state.voiture===v.nom?'selected':''}>${v.nom} – ${v.prix} ${v.unite}</option>`).join('')}</select></div>`;
}
if(state.services.includes('Sécurité privée')){html+=`<div style="margin:12px 0"><select id="securite" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border)"><option>1 garde</option><option>2 gardes</option><option>Escorte policière</option></select></div>`;}
if(state.services.some(s=>s.includes('Chef'))){html+=`<div style="margin:12px 0"><label style="font-weight:600;font-size:13px">Préférence culinaire ?</label><div style="display:flex;gap:10px;margin-top:6px"><label class="opt ${state.prefCul==='non'?'selected':''}" onclick="state.prefCul='non';render(4)"><input type="radio" ${state.prefCul==='non'?'checked':''}> Non</label><label class="opt ${state.prefCul==='oui'?'selected':''}" onclick="state.prefCul='oui';render(4)"><input type="radio" ${state.prefCul==='oui'?'checked':''}> Oui</label></div>${state.prefCul==='oui'?`<input id="cuisine" value="${state.cuisine}" placeholder="Ex: halal, vegan..." style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-top:8px">`:''}</div>`;}
html+=`<textarea id="desc" placeholder="${state.services.includes('Autre besoin – Expliquez-nous')?'Expliquez-nous votre besoin librement (ex: organiser fête surprise pour 10 personnes, acheter cadeau enfant, etc)':'Description complémentaire'}" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);min-height:90px;margin:10px 0">${state.desc}</textarea>`;
html+=`<p style="font-weight:600;font-size:13px">Budget</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="opt ${state.budget==='proposition'?'selected':''}" onclick="state.budget='proposition';render(4)"><input type="radio" ${state.budget==='proposition'?'checked':''}> Sur mesure</label><label class="opt ${state.budget==='avec'?'selected':''}" onclick="state.budget='avec';render(4)"><input type="radio" ${state.budget==='avec'?'checked':''}> J’ai un budget</label></div>${state.budget==='avec'?`<input id="budgetVal" value="${state.budgetVal}" placeholder="Ex: 200000 FCFA" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-top:8px">`:''}
<button class="btn-gold" style="width:100%;border-radius:100px;margin-top:18px" onclick="collect();sendWA()">Envoyer WhatsApp</button><button style="width:100%;border-radius:100px;background:var(--navy);color:white;border:none;padding:14px;font-weight:600;margin-top:8px" onclick="collect();sendMail()">Envoyer Gmail</button>`;
body.innerHTML=html;}
}
function toggleS(s){if(state.services.includes(s))state.services=state.services.filter(x=>x!==s);else state.services.push(s);render(3)}
function collect(){['nom','tel','membres','cuisine','budgetVal','desc'].forEach(id=>{const el=document.getElementById(id); if(el) state[id==='budgetVal'?'budgetVal':id]=el.value;}); const v=document.getElementById('voiture'); if(v) state.voiture=v.value; const sec=document.getElementById('securite'); if(sec) state.securite=sec.value;}
function buildTxt(){const heb=hebs.find(h=>h.id===state.heberg);return `CONCIERGERIE – Besoin:${state.type} – Formule:${heb?heb.name:state.heberg} – Services:${state.services.join('|')} – Vehicule:${state.voiture} – Conf:${state.conf} – Nom:${state.nom} – Tel:${state.tel} – Membres:${state.membres} – Securite:${state.securite} – Cuisine:${state.prefCul} ${state.cuisine} – Desc:${state.desc} – Budget:${state.budget} ${state.budgetVal}`;}
function sendToSheet(src){fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({service:'CONCIERGERIE',type:state.type,formule:hebs.find(h=>h.id===state.heberg)?.name,services:state.services.join(','),conf:state.conf,nom:state.nom,tel:state.tel,membres:state.membres,voiture:state.voiture,securite:state.securite,cuisine:state.cuisine,desc:state.desc,budget:state.budget,budgetVal:state.budgetVal,source:src})});}
function sendWA(){sendToSheet('WhatsApp'); window.open(`https://wa.me/24162516457?text=${encodeURIComponent((state.conf==='confidentielle'?'[CONFIDENTIELLE] ':'')+buildTxt())}`,'_blank');}
function sendMail(){sendToSheet('Gmail'); window.location.href=`mailto:magangabridge@gmail.com?subject=${encodeURIComponent('Conciergerie '+state.type)}&body=${encodeURIComponent(buildTxt())}`;}
document.addEventListener('DOMContentLoaded',async()=>{await loadPrix(); document.querySelectorAll('.config-tabs button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.s))); render(1);});
</script></body></html>
