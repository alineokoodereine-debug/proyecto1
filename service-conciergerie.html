<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conciergerie – L’Adresse SARL</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><header class="top-header"><div class="brand"><div class="brand-icon">L</div><div class="brand-name">L’ADRESSE SARL</div></div><a class="btn-contact" href="index.html">← Retour Accueil</a></header>
<section class="hero" style="min-height:45vh"><div class="hero-left"><h1>Conciergerie personnalisée</h1><div class="hero-sub">Quotidien, Business ou Événement – Glass, Libreville</div></div><div class="hero-right"><img src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=800"></div></section>
<section style="padding:80px 0;background:var(--cream)"><div class="container"><div class="config-wrap"><div class="config-tabs"><button data-s="1" id="tab1">1. Besoin</button><button data-s="2" id="tab2">2. Personnaliser</button><button data-s="3" id="tab3">3. Demande</button></div><div class="config-body" id="cfgBody"></div></div></div></section>
<script>
const SHEET_URL="https://script.google.com/macros/s/AKfycbww-7Nn7ro4OZ-R1oVuoLSdY6P7OWOHJzLl0I4KNazjOXjGYWlmxFzpq-ti7sHGA2zP/exec";
const state={type:null,services:[],conf:'standard',budget:'proposition',budgetVal:'',nom:'',tel:'',membres:'',cuisine:'',prefCul:'non',voiture:'',desc:''};
const servsQuotidien=["Courses urgentes & Cadeaux","Pressing & Blanchisserie","Gestion de colis & Livraisons","Entretien du domicile","Ménage & Rangement","Nounou & Garde d'enfants","Voiture & Chauffeur","Chef privé","Autre type de service – Précisez"];
const servsBusiness=["Assistant(e) dédié(e) – Secrétariat, agenda, RDV","Voiture & Chauffeur","Chef privé","Gestion de colis & Livraisons","Courses urgentes & Cadeaux","Autre type de service – Précisez"];
const servsEvenement=["Fête & Surprise (anniversaire, demande en mariage, baby shower...)","Courses & Cadeaux","Voiture & Chauffeur","Chef privé","Ménage & Rangement après fête","Autre besoin – Expliquez-nous"];
let prixVoitures=[];
function getServs(){if(state.type==='Quotidien')return servsQuotidien; if(state.type==='Business')return servsBusiness; return servsEvenement;}
async function loadPrix(){try{const r=await fetch(SHEET_URL+"?type=prix");const d=await r.json(); prixVoitures=d.filter(p=>String(p.actif).toLowerCase()==='oui');}catch(e){prixVoitures=[{nom:'Berline',prix:'20000',unite:'FCFA/J'},{nom:'SUV Premium',prix:'35000',unite:'FCFA/J'}];}}
function hasVoiture(){return state.services.some(s=>s.toLowerCase().includes('voiture')||s.toLowerCase().includes('chauffeur'));}
function isAutre(){return state.services.some(s=>s.toLowerCase().includes('autre'));}
function updateTabs(current){
 document.querySelectorAll('.config-tabs button').forEach(b=>b.classList.remove('active'));
 const active = document.getElementById('tab'+current);
 if(active) active.classList.add('active');
 // permitir clic a voluntad si ya pasó por ahí
 document.getElementById('tab1').style.opacity='1'; document.getElementById('tab1').style.pointerEvents='auto';
 document.getElementById('tab2').style.opacity= state.type ? '1':'0.4'; document.getElementById('tab2').style.pointerEvents= state.type ? 'auto':'none';
 document.getElementById('tab3').style.opacity= state.services.length ? '1':'0.4'; document.getElementById('tab3').style.pointerEvents= state.services.length ? 'auto':'none';
}
function render(n){
 updateTabs(n);
 const body=document.getElementById('cfgBody');
 if(n==1){
  body.innerHTML=`<div class="config-grid">${['Quotidien','Business','Événement','Personnalisée'].map(t=>`<div class="opt ${state.type===t?'selected':''}" onclick="state.type='${t}';render(1)"><b>${t}</b></div>`).join('')}</div><div style="display:flex;justify-content:space-between;margin-top:20px"><div></div><button class="btn-gold" onclick="if(!state.type){alert('Choisissez un besoin');return;}render(2)">Continuer →</button></div>`;
 }
 if(n==2){
  const list=getServs();
  body.innerHTML=`<div style="background:#f7f3ef;padding:12px;border-radius:10px;margin-bottom:16px;font-size:13px"><b>${state.type}</b> – Sélectionnez vos services</div><div class="config-grid">${list.map(s=>`<label class="opt ${state.services.includes(s)?'selected':''}"><input type="checkbox" ${state.services.includes(s)?'checked':''} onchange="toggleS('${s.replace(/'/g,"\\'")}')">${s}</label>`).join('')}</div><div style="display:flex;justify-content:space-between;margin-top:20px"><button class="btn-gold" style="background:transparent;color:var(--navy);border:1px solid var(--border)" onclick="render(1)">← Retour</button><button class="btn-gold" onclick="if(state.services.length===0){alert('Choisissez au moins 1 service');return;}render(3)">Continuer vers la demande →</button></div>`;
 }
 if(n==3){
  let html=`<div style="background:#f7f3ef;padding:12px;border-radius:10px;margin-bottom:10px"><b>${state.type} • ${state.services.join(', ')}</b></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0"><label class="opt ${state.conf==='standard'?'selected':''}" onclick="state.conf='standard';render(3)"><input type="radio" ${state.conf==='standard'?'checked':''}> Standard</label><label class="opt ${state.conf==='confidentielle'?'selected':''}" onclick="state.conf='confidentielle';render(3)"><input type="radio" ${state.conf==='confidentielle'?'checked':''}> Confidentielle</label></div>`;
  html+= state.conf==='standard'?`<input id="nom" placeholder="Nom complet" value="${state.nom}" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:10px"><input id="tel" placeholder="Téléphone" value="${state.tel}" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:10px"><input id="membres" placeholder="Personnes / foyer" value="${state.membres}" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:10px">`:`<input id="tel" placeholder="Téléphone" value="${state.tel}" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:10px">`;
  if(hasVoiture()){html+=`<div style="margin:12px 0"><label style="font-weight:600;font-size:13px">Véhicule (depuis Prix_Services)</label><select id="voiture" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-top:6px"><option value="">Sélectionnez</option>${prixVoitures.map(v=>`<option value="${v.nom} – ${v.prix} ${v.unite}">${v.nom} – ${v.prix} ${v.unite}</option>`).join('')}</select></div>`;}
  if(state.services.some(s=>s.includes('Chef'))){html+=`<div style="margin:12px 0"><label style="font-weight:600;font-size:13px">Préférence culinaire ?</label><div style="display:flex;gap:10px;margin-top:6px"><label class="opt ${state.prefCul==='non'?'selected':''}" onclick="state.prefCul='non';render(3)"><input type="radio" ${state.prefCul==='non'?'checked':''}> Non</label><label class="opt ${state.prefCul==='oui'?'selected':''}" onclick="state.prefCul='oui';render(3)"><input type="radio" ${state.prefCul==='oui'?'checked':''}> Oui</label></div>${state.prefCul==='oui'?`<input id="cuisine" value="${state.cuisine}" placeholder="Ex: halal, vegan..." style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-top:8px">`:''}</div>`;}
  html+=`<textarea id="desc" placeholder="${isAutre()?'Détaillez votre Autre type de service (obligatoire)...':'Description'}" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);min-height:110px;margin:10px 0">${state.desc}</textarea><p style="font-weight:600;font-size:13px">Budget</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="opt ${state.budget==='proposition'?'selected':''}" onclick="state.budget='proposition';render(3)"><input type="radio" ${state.budget==='proposition'?'checked':''}> Sur mesure</label><label class="opt ${state.budget==='avec'?'selected':''}" onclick="state.budget='avec';render(3)"><input type="radio" ${state.budget==='avec'?'checked':''}> Budget</label></div>${state.budget==='avec'?`<input id="budgetVal" value="${state.budgetVal}" placeholder="200000 FCFA" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-top:8px">`:''}
  <div style="display:flex;justify-content:space-between;margin-top:18px;gap:10px"><button class="btn-gold" style="background:transparent;color:var(--navy);border:1px solid var(--border);width:48%" onclick="render(2)">← Retour</button><div style="width:52%;display:flex;flex-direction:column;gap:8px"><button class="btn-gold" style="width:100%;border-radius:100px" onclick="collect();sendWA()">WhatsApp</button><button style="width:100%;border-radius:100px;background:var(--navy);color:white;border:none;padding:14px" onclick="collect();sendMail()">Gmail</button></div></div>`;
  body.innerHTML=html;
 }
}
function toggleS(s){if(state.services.includes(s))state.services=state.services.filter(x=>x!==s);else state.services.push(s);render(2)}
function collect(){['nom','tel','membres','cuisine','budgetVal','desc'].forEach(id=>{const el=document.getElementById(id); if(el) state[id==='budgetVal'?'budgetVal':id]=el.value;}); const v=document.getElementById('voiture'); if(v) state.voiture=v.value;}
function buildTxt(){return `CONCIERGERIE – Besoin:${state.type} – Services:${state.services.join('|')} – Vehicule:${state.voiture} – Conf:${state.conf} – Nom:${state.nom} – Tel:${state.tel} – Membres:${state.membres} – Desc:${state.desc} – Budget:${state.budget} ${state.budgetVal}`;}
function sendToSheet(src){fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({service:'CONCIERGERIE',type:state.type,formule:state.type,services:state.services.join(','),conf:state.conf,nom:state.nom,tel:state.tel,membres:state.membres,voiture:state.voiture,cuisine:state.cuisine,desc:state.desc,budget:state.budget,budgetVal:state.budgetVal,source:src})});}
function sendWA(){if(isAutre()&&!document.getElementById('desc').value){alert('Précisez votre autre service');return;}sendToSheet('WhatsApp'); window.open(`https://wa.me/24162516457?text=${encodeURIComponent((state.conf==='confidentielle'?'[CONFIDENTIELLE] ':'')+buildTxt())}`,'_blank');}
function sendMail(){if(isAutre()&&!document.getElementById('desc').value){alert('Précisez votre autre service');return;}sendToSheet('Gmail'); window.location.href=`mailto:magangabridge@gmail.com?subject=Conciergerie ${state.type}&body=${encodeURIComponent(buildTxt())}`;}
document.addEventListener('DOMContentLoaded',async()=>{
 await loadPrix();
 document.querySelectorAll('.config-tabs button').forEach(b=>b.addEventListener('click',()=>{
   const n=parseInt(b.dataset.s);
   if(n===1) render(1);
   if(n===2 && state.type) render(2);
   if(n===3 && state.services.length) render(3);
 }));
 render(1);
});
</script></body></html>
