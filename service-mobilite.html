<!DOCTYPE html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobilité & Chauffeur – L’Adresse SARL</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top-header"><div class="brand"><div class="brand-icon">L</div><div class="brand-name">L’ADRESSE SARL</div></div><a class="btn-contact" href="index.html">← Retour Accueil</a></header>
<section class="hero" style="min-height:45vh"><div class="hero-left"><h1>Mobilité & Chauffeur privé</h1><div class="hero-sub">Transferts, véhicules prestige sur devis, discrétion absolue.</div><p class="hero-desc" id="prix-desc">Prix depuis Google Sheet Prix_Services</p></div><div class="hero-right"><img src="https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?w=800"></div></section>
<section style="padding:80px 0;background:var(--cream)"><div class="container"><div class="config-wrap"><div class="config-tabs"><button class="active" data-s="1">1. Trajet</button><button data-s="2">2. Véhicule</button><button data-s="3">3. Personnaliser</button><button data-s="4">4. Demande</button></div><div class="config-body" id="cfgBody"></div></div></div></section>
<script>
const SHEET_URL="https://script.google.com/macros/s/AKfycbww-7Nn7ro4OZ-R1oVuoLSdY6P7OWOHJzLl0I4KNazjOXjGYWlmxFzpq-ti7sHGA2zP/exec";
const state={type:null,heberg:null,services:[],conf:'standard',budget:'proposition',budgetVal:'',nom:'',tel:'',membres:'',securite:'',voiture:'',desc:''};
let hebs=[];
const servs=["Guide touristique","Activités","Sécurité privée","Autre besoin – Expliquez-nous"];
async function loadPrix(){
 try{
  const r=await fetch(SHEET_URL+"?type=prix"); const d=await r.json();
  hebs=d.filter(p=>String(p.actif).toLowerCase()==='oui').map(p=>({id:p.id,name:`${p.nom} – ${p.prix} ${p.unite}`,cap:p.unite,img:'https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?w=400'}));
  if(!hebs.length) throw 'empty';
  document.getElementById('prix-desc').innerText=hebs.map(h=>h.name).join(' | ');
 }catch(e){ hebs=[{id:'b1',name:'Berline – 20.000 FCFA/j',cap:'3 pers',img:'https://images.unsplash.com/photo-1449965408869-eaa3f722e40d?w=400'},{id:'s1',name:'SUV Premium – 35.000 FCFA/j',cap:'5 pers',img:'https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=400'}];}
 render(1);
}
function render(n){
document.querySelectorAll('.config-tabs button').forEach(b=>b.classList.toggle('active',b.dataset.s==n));
const body=document.getElementById('cfgBody');
if(n==1){body.innerHTML=`<div class="config-grid">${['Aéroport','Journée','Business','Personnalisée'].map(t=>`<div class="opt ${state.type===t?'selected':''}" onclick="state.type='${t}';render(1)"><b>${t}</b></div>`).join('')}</div><div style="text-align:right;margin-top:20px"><button class="btn-gold" onclick="render(2)">Continuer →</button></div>`;}
if(n==2){body.innerHTML=`<div class="config-grid">${hebs.map(h=>`<div class="opt ${state.heberg===h.id?'selected':''}" onclick="state.heberg='${h.id}';state.voiture=h.name;render(2)"><img src="${h.img}"><div><b>${h.name}</b><br><small>${h.cap}</small></div></div>`).join('')}</div><div style="display:flex;justify-content:space-between;margin-top:20px"><button class="btn-gold" onclick="render(1)">← Retour</button><button class="btn-gold" onclick="render(3)">Personnaliser →</button></div>`;}
if(n==3){body.innerHTML=`<div style="background:var(--navy);color:white;padding:16px;border-radius:12px;margin-bottom:20px;font-size:13px">Ajoutez des services complémentaires à votre transfert.<br><b style="color:var(--gold-light)">✓ Assistance médicale incluse</b></div><div class="config-grid">${servs.map(s=>`<label class="opt ${state.services.includes(s)?'selected':''}"><input type="checkbox" ${state.services.includes(s)?'checked':''} onchange="toggleS('${s.replace(/'/g,"\\'")}')">${s}</label>`).join('')}</div><div style="text-align:right;margin-top:20px"><button class="btn-gold" onclick="render(4)">Demande →</button></div>`;}
if(n==4){
const heb=hebs.find(h=>h.id===state.heberg);
let html=`<div style="background:#f7f3ef;padding:12px;border-radius:10px;margin-bottom:10px"><b>${state.type||'—'} • ${heb?heb.name:'—'} • ${state.services.join(', ')||'Aucun'}</b></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0"><label class="opt ${state.conf==='standard'?'selected':''}" onclick="state.conf='standard';render(4)"><input type="radio" ${state.conf==='standard'?'checked':''}> Standard</label><label class="opt ${state.conf==='confidentielle'?'selected':''}" onclick="state.conf='confidentielle';render(4)"><input type="radio" ${state.conf==='confidentielle'?'checked':''}> Confidentielle</label></div>`;
html+= state.conf==='standard'?`<input id="nom" placeholder="Nom" value="${state.nom}" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:10px"><input id="tel" placeholder="Téléphone" value="${state.tel}" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:10px"><input id="membres" placeholder="Passagers" value="${state.membres}" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:10px">`:`<input id="tel" placeholder="Téléphone" value="${state.tel}" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-bottom:10px">`;
if(state.services.includes('Autre besoin – Expliquez-nous')){html+=`<textarea id="desc" placeholder="Expliquez votre besoin librement..." style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);min-height:80px;margin-top:10px">${state.desc}</textarea>`;}
html+=`<p style="font-weight:600;font-size:13px;margin-top:12px">Budget</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><label class="opt ${state.budget==='proposition'?'selected':''}" onclick="state.budget='proposition';render(4)"><input type="radio" ${state.budget==='proposition'?'checked':''}> Sur mesure</label><label class="opt ${state.budget==='avec'?'selected':''}" onclick="state.budget='avec';render(4)"><input type="radio" ${state.budget==='avec'?'checked':''}> Budget</label></div>${state.budget==='avec'?`<input id="budgetVal" value="${state.budgetVal}" placeholder="Ex: 150000 FCFA" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);margin-top:8px">`:''}
<button class="btn-gold" style="width:100%;border-radius:100px;margin-top:18px" onclick="collect();sendWA()">WhatsApp</button><button style="width:100%;border-radius:100px;background:var(--navy);color:white;border:none;padding:14px;margin-top:8px" onclick="collect();sendMail()">Gmail</button>`;
body.innerHTML=html;}
}
function toggleS(s){if(state.services.includes(s))state.services=state.services.filter(x=>x!==s);else state.services.push(s);render(3)}
function collect(){['nom','tel','membres','budgetVal','desc'].forEach(id=>{const el=document.getElementById(id); if(el) state[id==='budgetVal'?'budgetVal':id]=el.value;});}
function buildTxt(){const heb=hebs.find(h=>h.id===state.heberg);return `MOBILITE – Type:${state.type} – Vehicule:${heb?heb.name:state.heberg} – Services:${state.services.join(',')} – Conf:${state.conf} – Nom:${state.nom} – Tel:${state.tel} – Passagers:${state.membres} – Desc:${state.desc} – Budget:${state.budget} ${state.budgetVal}`;}
function sendToSheet(src){fetch(SHEET_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({service:'MOBILITE',type:state.type,formule:hebs.find(h=>h.id===state.heberg)?.name,services:state.services.join(','),conf:state.conf,nom:state.nom,tel:state.tel,membres:state.membres,voiture:state.voiture,desc:state.desc,budget:state.budget,budgetVal:state.budgetVal,source:src})});}
function sendWA(){sendToSheet('WhatsApp'); window.open(`https://wa.me/24162516457?text=${encodeURIComponent((state.conf==='confidentielle'?'[CONFIDENTIELLE] ':'')+buildTxt())}`,'_blank');}
function sendMail(){sendToSheet('Gmail'); window.location.href=`mailto:magangabridge@gmail.com?subject=Mobilité ${state.type}&body=${encodeURIComponent(buildTxt())}`;}
document.addEventListener('DOMContentLoaded',()=>{loadPrix(); document.querySelectorAll('.config-tabs button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.s)));});
</script></body></html>
